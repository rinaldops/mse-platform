<section id="mse-forum-provision" style="font: 14px/1.4 Segoe UI, Arial, sans-serif; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
  <h2 style="margin: 0 0 8px;">Forum provisioning</h2>
  <p id="mse-forum-provision-status">Starting...</p>
  <pre id="mse-forum-provision-output" style="white-space: pre-wrap; background: #f6f8fa; padding: 8px; overflow: auto;"></pre>
</section>

<script type="module">
  const status = document.querySelector("#mse-forum-provision-status");
  const output = document.querySelector("#mse-forum-provision-output");
  const write = (message, data) => {
    status.textContent = message;
    if (data !== undefined) output.textContent = JSON.stringify(data, null, 2);
  };

  try {
    write("Loading modules...");

    const [{ provisionLists }, { FORUM_LIST_SCHEMAS }] = await Promise.all([
      import("__SITE_ASSETS__/mse-platform/core/0.10.0/list-provisioning.js"),
      import("__SITE_ASSETS__/mse-platform/modules/forum/0.15.0/forum-schema.js")
    ]);

    write("Inspecting SharePoint lists...");

    const result = await provisionLists({
      webUrl: "__WEB_URL__",
      schemas: FORUM_LIST_SCHEMAS,
      confirm(plan) {
        output.textContent = JSON.stringify(plan, null, 2);
        return window.confirm("Provision forum lists for this site?");
      }
    });

    write(`Finished: ${result.status}`, result);
  } catch (error) {
    status.textContent = "Provisioning failed.";
    output.textContent = error?.stack || error?.message || String(error);
    console.error(error);
  }
</script>
