<!-- Todo adaptador `summary/module.js` do CAMAP-AGP (sd/dt1/mc/db/footer/
     blog/breadcrumbs) depende de dois globais clássicos (IIFEs que gravam em
     `window`, não módulos ES): `window.CAMAP.core` (core/core.js) e
     `window.CAMAP.render.<Tipo>` (ex. `window.CAMAP.render.SD`), este último
     só populado quando o PRÓPRIO script clássico do módulo (sd.js/dt1.js/
     mc.js/db.js/footer.js/blog.js) executa — mesmo padrão já usado em todo
     snippet MSE legado por módulo (ver modules/*/modern-script-editor.*.HML.
     html, cada um com <script src=".../core/core.js"> + <script
     src=".../modules/<tipo>/<tipo>.js">). O Site Kernel (mse-platform) é
     agnóstico a isso: só os módulos reais do CAMAP-AGP exigem esses globais.
     Sem estes <script>, uma carga de documento NOVA (URL digitada, F5,
     Ctrl+F5) deixa `window.CAMAP` indefinido/incompleto e todo módulo falha
     ("window.CAMAP.core (core.js) é obrigatório" ou
     "window.CAMAP.render.<Tipo> não está disponível") — só não falhava em
     navegação em memória pelo shell do SharePoint (clicar em outro item do
     menu) porque `window.CAMAP`, setado por Default.aspx, ainda estava vivo
     da página anterior.
     Carregados SEM `?camapRoot=`/`data-camap-root-id`: cada `<tipo>.js`
     termina em `mount()` chamando `core.scriptRootId(script)`
     (core/core.js:114-122), que devolve "" quando nenhum dos dois atributos
     está presente — `rootFromScript` então retorna null e `mount()` sai
     imediatamente SEM entrar no loop de retry de 120 tentativas (ver, ex.,
     modules/sd/sd.js, função `mount`, linhas finais) — carregar aqui só para
     registrar `window.CAMAP.render.<Tipo>` é seguro, não deixa timers soltos
     nem tenta montar em nenhum elemento desta página. Carregados antes de
     site-runner.js para já estarem disponíveis no primeiro render. -->
