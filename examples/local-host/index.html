<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mse-platform - host local</title>
  <style>
    body { margin: 2rem auto; max-width: 70rem; padding: 0 1rem; font: 16px/1.5 Arial, sans-serif; color: #242424; }
    main { display: grid; gap: 2rem; }
    section { border: 1px solid #d6d6d6; padding: 1rem; }
    fieldset { border: 0; border-top: 1px solid #d6d6d6; margin: 0 0 1rem; padding: 1rem 0 0; }
    .mse-admin-settings__field { display: grid; gap: .35rem; margin-bottom: 1rem; }
    input, select, button { box-sizing: border-box; min-height: 2.5rem; padding: .45rem .65rem; font: inherit; }
    .mse-admin-settings__actions { display: flex; gap: .75rem; }
  </style>
</head>
<body>
  <h1>Host local do mse-platform</h1>
  <main>
    <section><div id="sample"></div></section>
    <section><div id="settings"></div></section>
  </main>
  <script type="module" src="./local-host.js?v=0.8.1"></script>
</body>
</html>
